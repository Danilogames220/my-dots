#################
### AUTOSTART ###
#################

exec-once = swww-daemon

exec-once = hypridle

exec-once = $waybar
#exec-once = $syshud

exec-once = bash ~/.config/ags/notif-daemon.sh
exec-once = bash ~/.config/ags/osd.sh

exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# enable the verify thing in dolphin
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# shell scripts
exec-once = bash ~/.config/scripts/low-power.sh # low battery warning
#exec-once = ~/.config/scripts/laptop-lid.sh  # suspend / trigger hyprlock when laptop lid closes

# boot sound after all autostart boot up
exec-once = ffplay -nodisp -autoexit ~/.config/sounds/boot.mp3 
