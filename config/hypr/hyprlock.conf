# Source:
# https://www.reddit.com/r/unixporn/comments/1dhzu7y/how_is_my_hyprlock_hyprland/
# https://gist.github.com/ashish-kus/dd562b0bf5e8488a09e0b9c289f4574c

# pywal colors
source = ~/.cache/wal/colors-hyprland.conf
$color_1 = rgba(2555, 255, 255, 0.8)
#$color_1 = rgba(255, 255, 255, 0.8)
$color_2 = $color11

# GENERAL
general {
  #no_fade_in = true
  #grace = 1 # makes so that if you move your cursor, hyprlock quits
  #disable_loading_bar = false
  hide_cursor = false
  ignore_empty_input = true
  text_trim = true
}

#BACKGROUND
background {
    monitor = 
    #path = ~/wallpaper.png
    path = screenshot
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.625
    vibrancy = 0.1696
    #vibrancy_darkness = 0
}


# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $color_2 
    #shadow_pass = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 250
#    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    font_family = Ultra
    position = 0, 200
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
#    color = 0xff$color0
    color = $color_2
    font_size = 250 
#    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    font_family = Ultra
    position = 0, -60
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = $color_2 
    font_size = 17
    font_family = Rubik Bold
    position = 0, -165
    halign = center
    valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 40
    outline_thickness = 0
    #outer_color = rgba(50, 50, 50, 0.5)
    dots_size = 0.4 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = $color_1
    font_color = $color_2 
    fade_on_empty = false
    font_family = Rubik
    placeholder_text =  $USER
    hide_input = false
    position = 0, 250
    halign = center
    valign = bottom
    zindex = 10
}
# Information
label {
    monitor =
    text = cmd[update:1000] echo -e "$(~/.config/hypr/scripts/hyprlock/batteryinfo.sh)"
    color = $color_2 
    font_size = 12
    font_family = Rubik
    position = -20, -510
    halign = right
    valign = center
}
